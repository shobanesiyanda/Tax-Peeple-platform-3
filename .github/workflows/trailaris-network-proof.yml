name: Trailaris History Window Probe
on:
  push:
    branches: [trailaris-scratch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe 29 Exness Standard routes across candidate months
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, json, calendar
          from concurrent.futures import ThreadPoolExecutor, as_completed
          routes={
            'EURUSD':'EURUSDm','GBPUSD':'GBPUSDm','USDJPY':'USDJPYm','AUDUSD':'AUDUSDm','USDCAD':'USDCADm','USDCHF':'USDCHFm','NZDUSD':'NZDUSDm',
            'EURJPY':'EURJPYm','GBPJPY':'GBPJPYm','EURGBP':'EURGBPm','AUDJPY':'AUDJPYm','CADJPY':'CADJPYm','GBPCHF':'GBPCHFm',
            'XAUUSD':'XAUUSDm','XAGUSD':'XAGUSDm','BTCUSD':'BTCUSDm','ETHUSD':'ETHUSDm','SOLUSD':'SOLUSDm','BNBUSD':'BNBUSDm','XRPUSD':'XRPUSDm',
            'US100':'USTECm','US500':'US500m','US30':'US30m','GER40':'DE40m','UK100':'UK100m','JP225':'JP225m','WTI':'USOILm','BRENT':'UKOILm','NATGAS':'XNGUSDm'}
          months=[]
          y,m=2024,1
          while (y,m)<=(2026,7):
              months.append((y,m));m+=1
              if m==13:y+=1;m=1
          def probe(job):
              route,sym,y,m=job
              u=f'https://ticks.ex2archive.com/ticks/{sym}/{y}/{m:02d}/Exness_{sym}_{y}_{m:02d}.zip'
              try:
                  req=urllib.request.Request(u,method='HEAD',headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return route,y,m,(r.status==200),int(r.headers.get('Content-Length') or 0)
              except Exception:
                  return route,y,m,False,0
          jobs=[(r,s,y,m) for r,s in routes.items() for y,m in months]
          availability={r:{} for r in routes}; sizes={r:{} for r in routes}
          with ThreadPoolExecutor(max_workers=48) as ex:
              for route,y,m,ok,n in [f.result() for f in as_completed([ex.submit(probe,j) for j in jobs])]:
                  key=f'{y}-{m:02d}';availability[route][key]=ok;sizes[route][key]=n
          keys=[f'{y}-{m:02d}' for y,m in months]
          common=[k for k in keys if all(availability[r].get(k,False) for r in routes)]
          latest='2026-07'
          # longest contiguous common suffix ending in latest completed month
          suffix=[]
          for k in reversed(keys):
              if k>latest: continue
              if all(availability[r].get(k,False) for r in routes): suffix.append(k)
              else:
                  if suffix: break
          suffix=list(reversed(suffix))
          first_by_route={r:next((k for k in keys if availability[r].get(k,False)),None) for r in routes}
          missing_by_month={k:[r for r in routes if not availability[r].get(k,False)] for k in keys}
          print('COMMON_SUFFIX='+json.dumps({'start':suffix[0] if suffix else None,'end':suffix[-1] if suffix else None,'months':len(suffix)},sort_keys=True))
          print('FIRST_BY_ROUTE='+json.dumps(first_by_route,sort_keys=True))
          print('COMMON_MONTHS='+json.dumps(common))
          # compact diagnostics only for 2025 onward
          print('MISSING_2025_PLUS='+json.dumps({k:v for k,v in missing_by_month.items() if k>='2025-01' and v},sort_keys=True))
          PY
