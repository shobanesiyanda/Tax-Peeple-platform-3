name: Trailaris Deriv Retention Boundary
on:
  push:
    branches: [trailaris-scratch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact target dates and chunk limits
        shell: bash
        run: |
          python -m pip install --quiet websocket-client
          python - <<'PY'
          import websocket,json,datetime
          url='wss://ws.binaryws.com/websockets/v3?app_id=1089'
          def ep(s):return int(datetime.datetime.fromisoformat(s).replace(tzinfo=datetime.timezone.utc).timestamp())
          def call(req):
            ws=websocket.create_connection(url,timeout=45);ws.send(json.dumps(req));m=json.loads(ws.recv());ws.close();return m
          out=[]
          for e in ['2026-05-04T00:00:00','2026-05-15T00:00:00','2026-06-01T00:00:00','2026-06-15T00:00:00','2026-07-01T00:00:00','2026-08-01T00:00:00']:
            m=call({'ticks_history':'R_75','end':str(ep(e)),'count':5000,'style':'candles','granularity':60,'adjust_start_time':1});cs=m.get('candles',[])
            out.append({'end':e,'n':len(cs),'first':cs[0].get('epoch') if cs else None,'last':cs[-1].get('epoch') if cs else None,'error':m.get('error')})
          chunks=[]
          for n in [10000,25000,50000]:
            m=call({'ticks_history':'R_75','end':str(ep('2026-07-01T00:00:00')),'count':n,'style':'candles','granularity':60,'adjust_start_time':1});cs=m.get('candles',[])
            chunks.append({'requested':n,'n':len(cs),'first':cs[0].get('epoch') if cs else None,'last':cs[-1].get('epoch') if cs else None,'error':m.get('error')})
          print('DERIV_BOUNDARY='+json.dumps(out,sort_keys=True))
          print('DERIV_CHUNKS='+json.dumps(chunks,sort_keys=True))
          PY
