name: Trailaris Network Proof
on:
  push:
    branches: [trailaris-scratch]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe official data lanes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, json, ssl
          urls={
            'binance':'https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2026-05.zip',
            'exness_raw':'https://ticks.ex2archive.com/ticks/EURUSD_Raw_Spread/2026/05/Exness_EURUSD_Raw_Spread_2026_05.zip',
          }
          out={}
          for k,u in urls.items():
              try:
                  req=urllib.request.Request(u,method='HEAD',headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      out[k]={'status':r.status,'length':r.headers.get('Content-Length'),'type':r.headers.get('Content-Type'),'final':r.geturl()}
              except Exception as e:
                  out[k]={'error':repr(e)}
          print('HTTP_PROOF='+json.dumps(out,sort_keys=True))
          PY
          python -m pip install --quiet websocket-client
          python - <<'PY'
          import websocket, json
          url='wss://ws.binaryws.com/websockets/v3?app_id=1089'
          ws=websocket.create_connection(url,timeout=30)
          ws.send(json.dumps({'ticks_history':'R_75','end':'latest','count':10,'style':'candles','granularity':60,'adjust_start_time':1}))
          msg=json.loads(ws.recv()); ws.close()
          print('DERIV_PROOF='+json.dumps({'msg_type':msg.get('msg_type'),'candles':len(msg.get('candles',[])),'error':msg.get('error')},sort_keys=True))
          PY
