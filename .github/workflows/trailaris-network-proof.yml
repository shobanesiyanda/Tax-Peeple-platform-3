name: Trailaris Spec And Deriv History Probe
on:
  push:
    branches: [trailaris-scratch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact Deriv historical requests
        shell: bash
        run: |
          python -m pip install --quiet websocket-client
          python - <<'PY'
          import websocket,json,datetime
          endpoints=['wss://ws.binaryws.com/websockets/v3?app_id=1089','wss://api.derivws.com/trading/v1/options/ws/public']
          syms=['R_75','R_50','R_100','R_25','R_10']
          tests=[('2025-05-01','2025-05-01T03:00:00'),('2024-01-02','2024-01-02T03:00:00'),('2026-07-01','2026-07-01T03:00:00')]
          def ep(s): return int(datetime.datetime.fromisoformat(s).replace(tzinfo=datetime.timezone.utc).timestamp())
          out={}
          for endpoint in endpoints:
            eo={}
            for s in syms:
              so=[]
              for a,b in tests:
                req={'ticks_history':s,'start':ep(a),'end':str(ep(b)),'style':'candles','granularity':60,'adjust_start_time':0,'subscribe':0}
                try:
                  ws=websocket.create_connection(endpoint,timeout=30);ws.send(json.dumps(req));m=json.loads(ws.recv());ws.close();cs=m.get('candles',[])
                  so.append({'req':req,'n':len(cs),'first':cs[0]['epoch'] if cs else None,'last':cs[-1]['epoch'] if cs else None,'error':m.get('error'),'echo':m.get('echo_req')})
                except Exception as e:so.append({'req':req,'error':repr(e)})
              eo[s]=so
            out[endpoint]=eo
          print('DERIV_EXACT='+json.dumps(out,sort_keys=True))
          # active symbol metadata
          ws=websocket.create_connection(endpoints[0],timeout=30);ws.send(json.dumps({'active_symbols':'full'}));m=json.loads(ws.recv());ws.close()
          rows=[]
          for x in m.get('active_symbols',[]):
            sym=x.get('symbol') or x.get('underlying_symbol')
            if sym in syms: rows.append(x)
          print('DERIV_ACTIVE='+json.dumps(rows,sort_keys=True))
          PY
      - name: Inspect public broker specification HTML
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,json
          urls={
           'ex_eurusd':'https://www.exness.com/forex/eurusd/',
           'ex_us30':'https://www.exness.com/indices/us30/',
           'ex_ustec':'https://www.exness.com/indices/us-tech-100/',
           'ex_xau':'https://www.exness.com/commodities/gold/',
           'deriv_syn':'https://deriv.com/markets/derived-indices/synthetic-indices',
           'deriv_specs':'https://deriv.com/trading-specifications'
          }
          for k,u in urls.items():
            try:
              txt=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','replace')
              print('PAGE',k,'bytes',len(txt),'vol75',txt.lower().find('volatility 75'),'contractsize',txt.lower().find('contractsize'),'contract_size',txt.lower().find('contract_size'))
              # show compact contexts around likely data keys/endpoints
              pats=['contractSize','contract_size','minLot','min_lot','lotSize','pipValue','trading-calculator','api/','Volatility 75','Volatility 50','R_75']
              for p in pats:
                i=txt.find(p)
                if i>=0: print('CTX',k,p,txt[max(0,i-250):i+700].replace('\n',' ')[:950])
              if k.startswith('ex_'):
                eps=sorted(set(re.findall(r'https?://[^"\' ]+',txt)))
                print('URL_HINTS',k,json.dumps([x for x in eps if 'api' in x.lower() or 'calc' in x.lower() or 'instrument' in x.lower()][:20]))
            except Exception as e:print('PAGE_ERR',k,repr(e))
          PY
      - name: Probe Exness Standard Cent archive symbols
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json
          syms=['EURUSDc','GBPUSDc','USDJPYc','XAUUSDc','XAGUSDc']
          out={}
          for s in syms:
            u=f'https://ticks.ex2archive.com/ticks/{s}/2025/05/Exness_{s}_2025_05.zip'
            try:
              q=urllib.request.Request(u,method='HEAD',headers={'User-Agent':'Mozilla/5.0'});r=urllib.request.urlopen(q,timeout=20);out[s]={'status':r.status,'bytes':r.headers.get('Content-Length')}
            except Exception as e:out[s]={'error':repr(e)}
          print('EXNESS_CENT='+json.dumps(out,sort_keys=True))
          PY
