name: Trailaris Deriv Backward Pagination
on:
  push:
    branches: [trailaris-scratch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct synthetic history by end plus count
        shell: bash
        run: |
          python -m pip install --quiet websocket-client
          python - <<'PY'
          import websocket,json,datetime
          url='wss://ws.binaryws.com/websockets/v3?app_id=1089'
          syms=['R_75','R_50','R_100','R_25','R_10']
          ends=['2024-02-01T00:00:00','2025-06-01T00:00:00','2026-07-01T00:00:00']
          def ep(s):return int(datetime.datetime.fromisoformat(s).replace(tzinfo=datetime.timezone.utc).timestamp())
          def call(req):
            ws=websocket.create_connection(url,timeout=30);ws.send(json.dumps(req));m=json.loads(ws.recv());ws.close();return m
          out={}
          for s in syms:
            out[s]=[]
            for e in ends:
              req={'ticks_history':s,'end':str(ep(e)),'count':5000,'style':'candles','granularity':60,'adjust_start_time':1}
              m=call(req);cs=m.get('candles',[])
              out[s].append({'end':e,'n':len(cs),'first':cs[0].get('epoch') if cs else None,'last':cs[-1].get('epoch') if cs else None,'error':m.get('error'),'echo':m.get('echo_req')})
          print('DERIV_BACKWARD='+json.dumps(out,sort_keys=True))
          PY
